<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engram Dashboard</title>
<style>
:root { --bg: #0d1117; --surface: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --green: #3fb950; --red: #f85149; --yellow: #d29922; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
.container { max-width: 1200px; margin: 0 auto; padding: 1rem; }
header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 0; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
header h1 { font-size: 1.5rem; font-weight: 600; }
header h1 span { color: var(--accent); }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; }
.stat-card .label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.stat-card .value { font-size: 1.8rem; font-weight: 700; margin-top: 0.25rem; }
.stat-card .value.cost { color: var(--green); }
.search-bar { margin-bottom: 1.5rem; }
.search-bar input { width: 100%; padding: 0.75rem 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 1rem; outline: none; }
.search-bar input:focus { border-color: var(--accent); }
.tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
.tab { padding: 0.5rem 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; color: var(--muted); font-size: 0.9rem; }
.tab.active { color: var(--text); border-color: var(--accent); background: rgba(88, 166, 255, 0.1); }
.engram-list { display: flex; flex-direction: column; gap: 0.5rem; }
.engram-item { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; cursor: pointer; transition: border-color 0.15s; }
.engram-item:hover { border-color: var(--accent); }
.engram-item .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
.engram-item .id { font-family: monospace; color: var(--accent); font-size: 0.85rem; }
.engram-item .date { color: var(--muted); font-size: 0.85rem; }
.engram-item .summary { font-size: 0.95rem; }
.engram-item .meta { display: flex; gap: 1rem; margin-top: 0.5rem; font-size: 0.8rem; color: var(--muted); }
.badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 12px; font-size: 0.75rem; }
.badge.agent { background: rgba(88, 166, 255, 0.15); color: var(--accent); }
.badge.cost { background: rgba(63, 185, 80, 0.15); color: var(--green); }
.detail-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; }
.detail-panel h2 { font-size: 1.2rem; margin-bottom: 1rem; }
.detail-panel .section { margin-bottom: 1rem; }
.detail-panel .section h3 { font-size: 0.9rem; color: var(--muted); text-transform: uppercase; margin-bottom: 0.5rem; }
.detail-panel .file-list { font-family: monospace; font-size: 0.85rem; }
.detail-panel .file-list .created { color: var(--green); }
.detail-panel .file-list .modified { color: var(--yellow); }
.detail-panel .file-list .deleted { color: var(--red); }
.detail-panel .dead-end { background: rgba(248, 81, 73, 0.1); border-left: 3px solid var(--red); padding: 0.5rem; margin-bottom: 0.5rem; font-size: 0.9rem; border-radius: 0 4px 4px 0; }
.detail-panel .decision { background: rgba(88, 166, 255, 0.1); border-left: 3px solid var(--accent); padding: 0.5rem; margin-bottom: 0.5rem; font-size: 0.9rem; border-radius: 0 4px 4px 0; }
.back-btn { background: none; border: 1px solid var(--border); color: var(--muted); padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; margin-bottom: 1rem; }
.back-btn:hover { color: var(--text); border-color: var(--accent); }
.trend-chart { display: flex; align-items: flex-end; gap: 2px; height: 80px; margin-top: 0.5rem; }
.trend-bar { background: var(--accent); border-radius: 2px 2px 0 0; min-width: 8px; flex: 1; opacity: 0.8; }
.trend-bar:hover { opacity: 1; }
.empty { text-align: center; color: var(--muted); padding: 3rem; }
.loading { text-align: center; color: var(--muted); padding: 2rem; }
/* Notes styles */
.note-item { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 0.5rem; }
.note-item .commit-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem; }
.note-item .commit-sha { font-family: monospace; color: var(--accent); font-size: 0.85rem; }
.note-item .commit-msg { font-weight: 600; margin-bottom: 0.25rem; }
.note-item .note-meta { display: flex; gap: 0.75rem; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.5rem; flex-wrap: wrap; }
.note-item .note-body { font-family: monospace; font-size: 0.8rem; white-space: pre-wrap; background: var(--bg); padding: 0.75rem; border-radius: 4px; line-height: 1.5; color: var(--muted); }
/* Transcript styles */
.transcript { margin-top: 0.75rem; }
.transcript-entry { margin-bottom: 0.5rem; padding: 0.6rem 0.75rem; border-radius: 6px; font-size: 0.85rem; }
.transcript-entry.user { background: rgba(88, 166, 255, 0.08); border-left: 3px solid var(--accent); }
.transcript-entry.assistant { background: rgba(63, 185, 80, 0.06); border-left: 3px solid var(--green); }
.transcript-entry.system { background: rgba(210, 153, 34, 0.08); border-left: 3px solid var(--yellow); }
.transcript-entry.tool { background: var(--bg); border-left: 3px solid var(--muted); }
.transcript-entry .role-badge { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
.transcript-entry.user .role-badge { color: var(--accent); }
.transcript-entry.assistant .role-badge { color: var(--green); }
.transcript-entry.system .role-badge { color: var(--yellow); }
.transcript-entry.tool .role-badge { color: var(--muted); }
.transcript-entry .thinking-block { color: var(--muted); font-style: italic; }
.transcript-entry .tool-name { color: var(--yellow); font-weight: 600; font-family: monospace; }
.transcript-entry .tool-input { background: var(--bg); padding: 0.4rem 0.5rem; border-radius: 4px; margin-top: 0.25rem; font-family: monospace; font-size: 0.75rem; max-height: 150px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
.transcript-entry .tool-output { white-space: pre-wrap; max-height: 150px; overflow-y: auto; font-family: monospace; font-size: 0.8rem; margin-top: 0.25rem; }
.transcript-entry .error-output { color: var(--red); }
.transcript-entry .token-count { float: right; color: var(--muted); font-size: 0.7rem; }
.transcript-entry .entry-text { margin-top: 0.25rem; white-space: pre-wrap; }
.transcript-toggle { background: none; border: 1px solid var(--accent); color: var(--accent); padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
.transcript-toggle:hover { background: rgba(88, 166, 255, 0.1); }
/* Graph styles */
.graph-container { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem; position: relative; }
.graph-container svg { width: 100%; height: 550px; display: block; }
.graph-legend { position: absolute; top: 0.75rem; right: 0.75rem; background: var(--bg); border: 1px solid var(--border); padding: 0.5rem 0.75rem; border-radius: 6px; font-size: 0.75rem; }
.graph-legend .legend-item { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.2rem; }
.graph-legend .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
.graph-tooltip { position: absolute; background: var(--bg); border: 1px solid var(--border); padding: 0.4rem 0.6rem; border-radius: 4px; font-size: 0.8rem; pointer-events: none; display: none; z-index: 10; max-width: 300px; word-break: break-all; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1><span>engram</span> dashboard</h1>
    <div id="repo-info" style="color: var(--muted); font-size: 0.85rem;"></div>
  </header>

  <div id="stats-section" class="stats-grid"></div>

  <div class="search-bar">
    <input type="text" id="search-input" placeholder="Search reasoning history..." />
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="engrams">Engrams</div>
    <div class="tab" data-tab="trend">Cost Trend</div>
    <div class="tab" data-tab="files">Top Files</div>
    <div class="tab" data-tab="agents">By Agent</div>
    <div class="tab" data-tab="notes">Git Notes</div>
    <div class="tab" data-tab="graph">Graph</div>
  </div>

  <div id="content"></div>
</div>

<script>
const API = '';
let currentView = 'list';

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function fetchJSON(url) {
  const r = await fetch(API + url);
  return r.json();
}

async function loadStats() {
  const data = await fetchJSON('/api/stats');
  const el = document.getElementById('stats-section');
  const cost = data.total_cost_usd != null ? `$${data.total_cost_usd.toFixed(2)}` : '$0.00';
  el.innerHTML = `
    <div class="stat-card"><div class="label">Total Engrams</div><div class="value">${data.total_engrams}</div></div>
    <div class="stat-card"><div class="label">Total Tokens</div><div class="value">${(data.total_tokens || 0).toLocaleString()}</div></div>
    <div class="stat-card"><div class="label">Total Cost</div><div class="value cost">${cost}</div></div>
    <div class="stat-card"><div class="label">Agents</div><div class="value">${(data.by_agent || []).length}</div></div>
  `;
}

async function loadEngrams(query) {
  const url = query ? `/api/search?q=${encodeURIComponent(query)}` : '/api/engrams?limit=50';
  const data = await fetchJSON(url);
  const items = query ? data.results : data.engrams;
  const el = document.getElementById('content');

  if (!items || items.length === 0) {
    el.innerHTML = '<div class="empty">No engrams found.</div>';
    return;
  }

  el.innerHTML = '<div class="engram-list">' + items.map(e => `
    <div class="engram-item" onclick="showDetail('${e.id}')">
      <div class="header">
        <span class="id">${e.short_id || e.id.slice(0, 8)}</span>
        <span class="date">${new Date(e.created_at).toLocaleDateString()}</span>
      </div>
      <div class="summary">${escapeHtml(e.summary) || '(no summary)'}</div>
      <div class="meta">
        <span class="badge agent">${escapeHtml(e.agent)}</span>
        ${e.model ? `<span>${escapeHtml(e.model)}</span>` : ''}
        <span>${(e.tokens || 0).toLocaleString()} tokens</span>
        <span class="badge cost">$${(e.cost_usd || 0).toFixed(2)}</span>
        ${e.score != null ? `<span>score: ${e.score.toFixed(2)}</span>` : ''}
      </div>
    </div>
  `).join('') + '</div>';
}

async function showDetail(id) {
  currentView = 'detail';
  const data = await fetchJSON(`/api/engrams/${id}`);
  const el = document.getElementById('content');
  const cost = data.cost_usd != null ? `$${data.cost_usd.toFixed(2)}` : 'N/A';

  let html = `<button class="back-btn" onclick="backToList()">&larr; Back</button>`;
  html += `<div class="detail-panel">`;
  html += `<h2>${escapeHtml(data.summary || data.intent?.request || '(no summary)')}</h2>`;
  html += `<div class="section"><h3>Details</h3>`;
  html += `<p><strong>ID:</strong> <code>${data.id}</code></p>`;
  html += `<p><strong>Agent:</strong> ${escapeHtml(data.agent)} ${data.model ? `(${escapeHtml(data.model)})` : ''}</p>`;
  html += `<p><strong>Date:</strong> ${new Date(data.created_at).toLocaleString()}</p>`;
  html += `<p><strong>Tokens:</strong> ${(data.tokens || 0).toLocaleString()} | <strong>Cost:</strong> ${cost}</p>`;
  html += `</div>`;

  if (data.intent) {
    html += `<div class="section"><h3>Intent</h3>`;
    html += `<p><strong>Request:</strong> ${escapeHtml(data.intent.request || '')}</p>`;
    if (data.intent.goal) html += `<p><strong>Goal:</strong> ${escapeHtml(data.intent.goal)}</p>`;
    if (data.intent.summary) html += `<p><strong>Summary:</strong> ${escapeHtml(data.intent.summary)}</p>`;
    html += `</div>`;
  }

  if (data.file_changes && data.file_changes.length > 0) {
    html += `<div class="section"><h3>File Changes</h3><div class="file-list">`;
    data.file_changes.forEach(fc => {
      const cls = fc.change_type;
      const symbol = fc.change_type === 'created' ? '+' : fc.change_type === 'deleted' ? '-' : '~';
      const lines = [];
      if (fc.lines_added) lines.push(`+${fc.lines_added}`);
      if (fc.lines_removed) lines.push(`-${fc.lines_removed}`);
      html += `<div class="${cls}">${symbol} ${escapeHtml(fc.path)} ${lines.length ? `(${lines.join('/')})` : ''}</div>`;
    });
    html += `</div></div>`;
  }

  if (data.dead_ends && data.dead_ends.length > 0) {
    html += `<div class="section"><h3>Dead Ends</h3>`;
    data.dead_ends.forEach(de => {
      html += `<div class="dead-end"><strong>${escapeHtml(de.approach)}:</strong> ${escapeHtml(de.reason)}</div>`;
    });
    html += `</div>`;
  }

  if (data.decisions && data.decisions.length > 0) {
    html += `<div class="section"><h3>Decisions</h3>`;
    data.decisions.forEach(d => {
      html += `<div class="decision"><strong>${escapeHtml(d.description)}:</strong> ${escapeHtml(d.rationale)}</div>`;
    });
    html += `</div>`;
  }

  // Transcript section
  const tc = data.transcript_count || 0;
  html += `<div class="section"><h3>Transcript</h3>`;
  if (tc > 0) {
    html += `<button class="transcript-toggle" onclick="loadTranscript('${data.id}')">Load Transcript (${tc} entries)</button>`;
  } else {
    html += `<p style="color:var(--muted)">No transcript recorded.</p>`;
  }
  html += `<div id="transcript-container"></div></div>`;

  html += `</div>`;
  el.innerHTML = html;
}

function backToList() {
  currentView = 'list';
  const query = document.getElementById('search-input').value.trim();
  loadEngrams(query || null);
}

async function loadTrend() {
  const data = await fetchJSON('/api/stats/trend');
  const el = document.getElementById('content');
  const trend = data.trend || [];
  if (trend.length === 0) {
    el.innerHTML = '<div class="empty">No data in the last 30 days.</div>';
    return;
  }
  const maxCost = Math.max(...trend.map(t => t.cost_usd || 0), 0.01);
  let html = '<div class="detail-panel"><h2>Cost Trend (Last 30 Days)</h2>';
  html += '<div class="trend-chart">';
  trend.forEach(t => {
    const h = Math.max(((t.cost_usd || 0) / maxCost) * 100, 2);
    html += `<div class="trend-bar" style="height:${h}%" title="${t.date}: $${(t.cost_usd||0).toFixed(2)} (${t.sessions} sessions)"></div>`;
  });
  html += '</div>';
  html += '<table style="width:100%;margin-top:1rem;font-size:0.85rem;">';
  html += '<tr style="color:var(--muted)"><th style="text-align:left">Date</th><th style="text-align:right">Sessions</th><th style="text-align:right">Tokens</th><th style="text-align:right">Cost</th></tr>';
  trend.forEach(t => {
    html += `<tr><td>${t.date}</td><td style="text-align:right">${t.sessions}</td><td style="text-align:right">${(t.tokens||0).toLocaleString()}</td><td style="text-align:right;color:var(--green)">$${(t.cost_usd||0).toFixed(2)}</td></tr>`;
  });
  html += '</table></div>';
  el.innerHTML = html;
}

async function loadFiles() {
  const data = await fetchJSON('/api/stats/by-file?top=20');
  const el = document.getElementById('content');
  const files = data.files || [];
  if (files.length === 0) { el.innerHTML = '<div class="empty">No file data.</div>'; return; }
  let html = '<div class="detail-panel"><h2>Top Files by Cost</h2>';
  html += '<table style="width:100%;font-size:0.85rem;">';
  html += '<tr style="color:var(--muted)"><th style="text-align:left">File</th><th style="text-align:right">Sessions</th><th style="text-align:right">Tokens</th><th style="text-align:right">Cost</th></tr>';
  files.forEach(f => {
    html += `<tr><td style="font-family:monospace">${escapeHtml(f.file)}</td><td style="text-align:right">${f.sessions}</td><td style="text-align:right">${(f.tokens||0).toLocaleString()}</td><td style="text-align:right;color:var(--green)">$${(f.cost_usd||0).toFixed(2)}</td></tr>`;
  });
  html += '</table></div>';
  el.innerHTML = html;
}

async function loadAgents() {
  const data = await fetchJSON('/api/stats/by-agent');
  const el = document.getElementById('content');
  const agents = data.agents || [];
  if (agents.length === 0) { el.innerHTML = '<div class="empty">No agent data.</div>'; return; }
  let html = '<div class="detail-panel"><h2>By Agent</h2>';
  html += '<table style="width:100%;font-size:0.85rem;">';
  html += '<tr style="color:var(--muted)"><th style="text-align:left">Agent</th><th style="text-align:right">Sessions</th><th style="text-align:right">Tokens</th><th style="text-align:right">Cost</th></tr>';
  agents.forEach(a => {
    html += `<tr><td><span class="badge agent">${escapeHtml(a.agent)}</span></td><td style="text-align:right">${a.count}</td><td style="text-align:right">${(a.tokens||0).toLocaleString()}</td><td style="text-align:right;color:var(--green)">$${(a.cost_usd||0).toFixed(2)}</td></tr>`;
  });
  html += '</table></div>';
  el.innerHTML = html;
}

// --- Git Notes ---
async function loadNotes() {
  const el = document.getElementById('content');
  el.innerHTML = '<div class="loading">Loading git notes...</div>';
  const data = await fetchJSON('/api/notes?limit=100');
  const notes = data.notes || [];
  if (notes.length === 0) {
    el.innerHTML = '<div class="empty">No git notes found. Run <code>engram annotate</code> to add reasoning notes to commits.</div>';
    return;
  }
  let html = '<div class="detail-panel"><h2>Git Notes (Reasoning on Commits)</h2>';
  html += `<p style="color:var(--muted);margin-bottom:1rem;font-size:0.85rem">${notes.length} annotated commit(s)</p>`;
  notes.forEach(n => {
    html += `<div class="note-item">
      <div class="commit-info">
        <span class="commit-sha">${n.commit_short}</span>
        <span style="color:var(--muted);font-size:0.8rem">${n.commit_date ? new Date(n.commit_date).toLocaleDateString() : ''}</span>
      </div>
      <div class="commit-msg">${escapeHtml(n.commit_message)}</div>
      <div class="note-meta">
        ${n.agent ? `<span class="badge agent">${escapeHtml(n.agent)}</span>` : ''}
        ${n.model ? `<span>${escapeHtml(n.model)}</span>` : ''}
        ${n.cost ? `<span class="badge cost">${escapeHtml(n.cost)}</span>` : ''}
        ${n.tokens ? `<span>${escapeHtml(n.tokens)}</span>` : ''}
        <span>${escapeHtml(n.commit_author)}</span>
      </div>
      <div class="note-body">${escapeHtml(n.note_text)}</div>
    </div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

// --- Transcript Browser ---
async function loadTranscript(id) {
  const container = document.getElementById('transcript-container');
  if (!container) return;
  container.innerHTML = '<div class="loading">Loading transcript...</div>';
  const data = await fetchJSON(`/api/engrams/${id}/transcript`);
  const entries = data.entries || [];
  if (entries.length === 0) {
    container.innerHTML = '<p style="color:var(--muted)">No transcript entries.</p>';
    return;
  }
  let html = '<div class="transcript">';
  entries.forEach(e => {
    const role = e.role || 'unknown';
    html += `<div class="transcript-entry ${role}">`;
    html += `<span class="role-badge">${role}</span>`;
    if (e.token_count) html += `<span class="token-count">${e.token_count.toLocaleString()} tok</span>`;

    const type = e.type || 'text';
    if (type === 'text') {
      html += `<div class="entry-text">${escapeHtml(e.text)}</div>`;
    } else if (type === 'thinking') {
      html += `<div class="thinking-block">${escapeHtml(e.text)}</div>`;
    } else if (type === 'tool_use') {
      html += `<div><span class="tool-name">${escapeHtml(e.tool_name)}</span></div>`;
      if (e.input) {
        const inputStr = typeof e.input === 'string' ? e.input : JSON.stringify(e.input, null, 2);
        html += `<div class="tool-input">${escapeHtml(inputStr)}</div>`;
      }
    } else if (type === 'tool_result') {
      const cls = e.is_error ? ' error-output' : '';
      html += `<div class="tool-output${cls}">${escapeHtml(e.output)}</div>`;
    }
    html += '</div>';
  });
  html += '</div>';
  container.innerHTML = html;
}

// --- Context Graph ---
const GRAPH_COLORS = { Engram: '#58a6ff', File: '#d29922', Agent: '#3fb950', Commit: '#8b949e' };
const GRAPH_RADIUS = { Engram: 8, File: 6, Agent: 10, Commit: 5 };

async function loadGraph(center, depth) {
  const el = document.getElementById('content');
  el.innerHTML = '<div class="loading">Building graph...</div>';
  let url = '/api/graph';
  const params = [];
  if (center) params.push(`center=${encodeURIComponent(center)}`);
  if (depth) params.push(`depth=${depth}`);
  if (params.length) url += '?' + params.join('&');

  const data = await fetchJSON(url);
  if (!data.nodes || data.nodes.length === 0) {
    el.innerHTML = '<div class="empty">No graph data available. Import or record some engrams first.</div>';
    return;
  }

  el.innerHTML = `
    <div class="graph-container">
      <svg id="graph-svg"></svg>
      <div class="graph-legend">
        <div class="legend-item"><div class="legend-dot" style="background:${GRAPH_COLORS.Engram}"></div> Engram</div>
        <div class="legend-item"><div class="legend-dot" style="background:${GRAPH_COLORS.File}"></div> File</div>
        <div class="legend-item"><div class="legend-dot" style="background:${GRAPH_COLORS.Agent}"></div> Agent</div>
        <div class="legend-item"><div class="legend-dot" style="background:${GRAPH_COLORS.Commit}"></div> Commit</div>
      </div>
      <div class="graph-tooltip" id="graph-tooltip"></div>
      <div style="color:var(--muted);font-size:0.8rem;margin-top:0.5rem;padding:0 0.5rem">
        ${data.node_count} nodes, ${data.edge_count} edges${center ? ` (centered on ${escapeHtml(center)})` : ''}. Click a node to recenter.
      </div>
    </div>`;

  renderForceGraph(data.nodes, data.edges);
}

function renderForceGraph(nodes, edges) {
  const svg = document.getElementById('graph-svg');
  if (!svg) return;
  const W = svg.clientWidth || 900;
  const H = svg.clientHeight || 550;
  const ns = 'http://www.w3.org/2000/svg';

  // Build adjacency for edge lookup
  const nodeMap = {};
  nodes.forEach((n, i) => {
    n._x = W/2 + (Math.random() - 0.5) * W * 0.6;
    n._y = H/2 + (Math.random() - 0.5) * H * 0.6;
    n._vx = 0; n._vy = 0;
    n._idx = i;
    nodeMap[n.id] = n;
  });

  // Force simulation
  const repulsion = 800;
  const springLen = 120;
  const springK = 0.005;
  const gravity = 0.01;
  const damping = 0.9;
  const iterations = 250;

  for (let iter = 0; iter < iterations; iter++) {
    // Repulsion (all pairs)
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        let dx = nodes[i]._x - nodes[j]._x;
        let dy = nodes[i]._y - nodes[j]._y;
        let dist = Math.sqrt(dx*dx + dy*dy) || 1;
        let force = repulsion / (dist * dist);
        let fx = (dx / dist) * force;
        let fy = (dy / dist) * force;
        nodes[i]._vx += fx; nodes[i]._vy += fy;
        nodes[j]._vx -= fx; nodes[j]._vy -= fy;
      }
    }

    // Attraction (edges)
    edges.forEach(e => {
      const a = nodeMap[e.from], b = nodeMap[e.to];
      if (!a || !b) return;
      let dx = b._x - a._x;
      let dy = b._y - a._y;
      let dist = Math.sqrt(dx*dx + dy*dy) || 1;
      let force = (dist - springLen) * springK;
      let fx = (dx / dist) * force;
      let fy = (dy / dist) * force;
      a._vx += fx; a._vy += fy;
      b._vx -= fx; b._vy -= fy;
    });

    // Gravity toward center
    nodes.forEach(n => {
      n._vx += (W/2 - n._x) * gravity;
      n._vy += (H/2 - n._y) * gravity;
    });

    // Apply velocities
    nodes.forEach(n => {
      n._vx *= damping; n._vy *= damping;
      n._x += n._vx; n._y += n._vy;
      // Clamp to bounds
      n._x = Math.max(20, Math.min(W - 20, n._x));
      n._y = Math.max(20, Math.min(H - 20, n._y));
    });
  }

  // Render SVG
  svg.innerHTML = '';
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  // Edges
  edges.forEach(e => {
    const a = nodeMap[e.from], b = nodeMap[e.to];
    if (!a || !b) return;
    const line = document.createElementNS(ns, 'line');
    line.setAttribute('x1', a._x); line.setAttribute('y1', a._y);
    line.setAttribute('x2', b._x); line.setAttribute('y2', b._y);
    line.setAttribute('stroke', '#30363d'); line.setAttribute('stroke-width', '1');
    line.setAttribute('opacity', '0.6');
    svg.appendChild(line);
  });

  // Nodes
  const tooltip = document.getElementById('graph-tooltip');
  nodes.forEach(n => {
    const r = GRAPH_RADIUS[n.node_type] || 6;
    const color = GRAPH_COLORS[n.node_type] || '#8b949e';

    const circle = document.createElementNS(ns, 'circle');
    circle.setAttribute('cx', n._x); circle.setAttribute('cy', n._y);
    circle.setAttribute('r', r); circle.setAttribute('fill', color);
    circle.setAttribute('stroke', '#0d1117'); circle.setAttribute('stroke-width', '1.5');
    circle.style.cursor = 'pointer';

    circle.addEventListener('mouseenter', (ev) => {
      if (tooltip) {
        tooltip.style.display = 'block';
        tooltip.style.left = (ev.offsetX + 12) + 'px';
        tooltip.style.top = (ev.offsetY - 8) + 'px';
        tooltip.textContent = `${n.node_type}: ${n.label}`;
      }
    });
    circle.addEventListener('mouseleave', () => {
      if (tooltip) tooltip.style.display = 'none';
    });
    circle.addEventListener('click', () => {
      loadGraph(n.id, 2);
    });

    svg.appendChild(circle);

    // Label (short)
    const label = n.label.length > 20 ? n.label.slice(0, 18) + '..' : n.label;
    const text = document.createElementNS(ns, 'text');
    text.setAttribute('x', n._x); text.setAttribute('y', n._y + r + 12);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('fill', '#8b949e'); text.setAttribute('font-size', '9');
    text.setAttribute('font-family', 'monospace');
    text.textContent = label;
    svg.appendChild(text);
  });
}

// Tab switching
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentView = 'list';
    switch(tab.dataset.tab) {
      case 'engrams': loadEngrams(); break;
      case 'trend': loadTrend(); break;
      case 'files': loadFiles(); break;
      case 'agents': loadAgents(); break;
      case 'notes': loadNotes(); break;
      case 'graph': loadGraph(); break;
    }
  });
});

// Search
let searchTimeout;
document.getElementById('search-input').addEventListener('input', e => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    const q = e.target.value.trim();
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelector('[data-tab="engrams"]').classList.add('active');
    loadEngrams(q || null);
  }, 300);
});

// Init
loadStats();
loadEngrams();
</script>
